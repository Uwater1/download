name: Weekly Data Download

on:
  schedule:
    - cron: '0 0 * * 6'  # Runs at midnight every Saturday (UTC)
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run download script
        run: python download_data.py > work_log_$(date +'%Y-%m-%d').txt 2>&1

      - name: Write work summary
        run: |
          echo "## Work Summary" >> $GITHUB_STEP_SUMMARY
          echo "Downloaded financial data for $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "CSV files saved in $(date +'%Y-%m-%d')/ folder" >> $GITHUB_STEP_SUMMARY
          echo "Work log available in work_log_$(date +'%Y-%m-%d').txt" >> $GITHUB_STEP_SUMMARY

      - name: Commit and push downloaded data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "Add downloaded data for $(date +'%Y-%m-%d')"
          git push